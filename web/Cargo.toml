[package]
name = "dokitier-web"
description = "dokitier embedded web console: topology, metrics, routing config."
version = "2.7.9"
edition.workspace = true
rust-version.workspace = true
license-file = "../LICENSE"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["macros", "ws"] }
chrono.workspace = true
cidr.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
argon2 = "0.5"
base64.workspace = true
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
