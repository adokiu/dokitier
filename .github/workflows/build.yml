name: build

# Single pipeline: one run builds every binary the release needs.
# Triggered by a version tag (or manually) only - pushing code no longer
# spawns a second "ci" run doing the same build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.7.4)'
        required: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf
          # nightly + rust-src are required for -Z build-std (rebuild std with
          # panic_abort, which is a large win for the size-constrained binaries).
          rustup toolchain install nightly --profile minimal --component rust-src

      - name: Install protoc + zig
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev
          sudo apt-get install -y upx-ucl 2>/dev/null || sudo apt-get install -y upx || echo "::warning::upx not installed"
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build core (amd64 musl, tiny)
        run: |
          FEATURES="management,tun,tcp-hole-punch,endpoint-discovery,quic,icmp-proxy"
          cargo +nightly zigbuild --profile tiny -p dokitier --bin dokitier-core \
            --target x86_64-unknown-linux-musl \
            --no-default-features --features "$FEATURES" \
            -Z build-std=std,panic_abort
          cp target/x86_64-unknown-linux-musl/tiny/dokitier-core dokitier-core-amd64

      - name: Build core (arm64 musl, tiny)
        run: |
          FEATURES="management,tun,tcp-hole-punch,endpoint-discovery,quic,icmp-proxy"
          cargo +nightly zigbuild --profile tiny -p dokitier --bin dokitier-core \
            --target aarch64-unknown-linux-musl \
            --no-default-features --features "$FEATURES" \
            -Z build-std=std,panic_abort
          cp target/aarch64-unknown-linux-musl/tiny/dokitier-core dokitier-core-arm64

      - name: Build core (armv7 musl, tiny)
        run: |
          FEATURES="management,tun,tcp-hole-punch,endpoint-discovery,quic,icmp-proxy"
          cargo +nightly zigbuild --profile tiny -p dokitier --bin dokitier-core \
            --target armv7-unknown-linux-musleabihf \
            --no-default-features --features "$FEATURES" \
            -Z build-std=std,panic_abort
          cp target/armv7-unknown-linux-musleabihf/tiny/dokitier-core dokitier-core-armv7
          # OpenWrt routers are flash constrained: shrink further with UPX when it
          # accepts the static musl ELF, keeping the raw binary as a fallback.
          cp dokitier-core-armv7 dokitier-core-armv7.raw
          if upx --best --lzma -o dokitier-core-armv7.upx dokitier-core-armv7.raw; then
            mv dokitier-core-armv7.upx dokitier-core-armv7
          else
            echo "::warning::upx could not pack this ELF; shipping the uncompressed binary"
            rm -f dokitier-core-armv7.upx
          fi
          ls -l dokitier-core-armv7 dokitier-core-armv7.raw

      - name: Report binary sizes
        run: |
          ls -l dokitier-core-amd64 dokitier-core-arm64 dokitier-core-armv7
          echo "15MiB budget check (armv7/OpenWrt):"
          size=$(stat -c%s dokitier-core-armv7)
          echo "dokitier-core-armv7 = $size bytes"
          if [ "$size" -gt 15728640 ]; then
            echo "::error::dokitier-core-armv7 is ${size} bytes (>15MiB); trim features or add compression"
            exit 1
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dokitier-${{ github.ref_name }}-binaries
          path: |
            dokitier-core-amd64
            dokitier-core-arm64
            dokitier-core-armv7
            scripts/install.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dokitier-core-amd64
            dokitier-core-arm64
            dokitier-core-armv7
            scripts/install.sh
