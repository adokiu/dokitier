name: build

# Full-feature core binaries for every supported platform/architecture.
# Triggered by a version tag or manually (workflow_dispatch with a tag input).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.7.13)'
        required: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  webui:
    name: build webui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/webui/package-lock.json

      - name: Build webui (embedded into console at compile time)
        working-directory: web/webui
        run: |
          set -e
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html
          du -sh dist

      - name: Upload webui dist
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: web/webui/dist
          if-no-files-found: error

  build:
    name: ${{ matrix.asset }}
    needs: webui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: dokitier-core-amd64
            console_asset: dokitier-console-amd64
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: dokitier-core-arm64
            console_asset: dokitier-console-arm64
            zig: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            asset: dokitier-core-armv7
            console_asset: dokitier-console-armv7
            zig: true
            upx: true
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            asset: dokitier-core-x86
            console_asset: dokitier-console-x86
            zig: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dokitier-core-windows-amd64.exe
            console_asset: dokitier-console-windows-amd64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: dokitier-core-macos-arm64
            console_asset: dokitier-console-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: dokitier-core-macos-amd64
            console_asset: dokitier-console-macos-amd64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Download webui dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: web/webui/dist

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev clang libclang-dev upx-ucl

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          brew install upx || true

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc llvm -y --no-progress

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild
        if: ${{ matrix.zig }}
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build (full default features, unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --profile tiny -p dokitier --bin dokitier-core \
              --target ${{ matrix.target }}
          else
            cargo build --profile tiny -p dokitier --bin dokitier-core \
              --target ${{ matrix.target }}
          fi
          cp "target/${{ matrix.target }}/tiny/dokitier-core" "${{ matrix.asset }}"
          ls -l "${{ matrix.asset }}"

      - name: Build (full default features, windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          set -e
          # custom profiles confuse the proto build script on Windows (it looks
          # for a "release"/"debug" path component); use release there.
          cargo build --release -p dokitier --bin dokitier-core \
            --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/dokitier-core.exe" "${{ matrix.asset }}"
          ls -l "${{ matrix.asset }}"

      - name: Build console (unix, embedded webui)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          test -f web/webui/dist/index.html
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --profile tiny -p dokitier-console --bin dokitier-console \
              --target ${{ matrix.target }}
          else
            cargo build --profile tiny -p dokitier-console --bin dokitier-console \
              --target ${{ matrix.target }}
          fi
          cp "target/${{ matrix.target }}/tiny/dokitier-console" "${{ matrix.console_asset }}"
          ls -l "${{ matrix.console_asset }}"

      - name: Build console (windows, embedded webui)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          set -e
          cargo build --release -p dokitier-console --bin dokitier-console \
            --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/dokitier-console.exe" "${{ matrix.console_asset }}"
          ls -l "${{ matrix.console_asset }}"

      - name: Compress armv7 with UPX (OpenWrt flash budget)
        if: ${{ matrix.upx }}
        shell: bash
        run: |
          set -e
          cp "${{ matrix.asset }}" "${{ matrix.asset }}.raw"
          if upx --best --lzma -o "${{ matrix.asset }}.upx" "${{ matrix.asset }}.raw"; then
            mv "${{ matrix.asset }}.upx" "${{ matrix.asset }}"
          else
            echo "::warning::upx could not pack this ELF; shipping the uncompressed binary"
            rm -f "${{ matrix.asset }}.upx"
          fi
          ls -l "${{ matrix.asset }}" "${{ matrix.asset }}.raw"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload console artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.console_asset }}
          path: ${{ matrix.console_asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: 'dokitier-*'
          merge-multiple: true
          path: release

      - name: List release assets
        run: ls -l release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
            scripts/install.sh
