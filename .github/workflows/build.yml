name: build

# Single pipeline: one run builds every binary the release needs.
# Triggered by a version tag (or manually) only - pushing code no longer
# spawns a second "ci" run doing the same build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.7.4)'
        required: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web UI
        working-directory: web/webui
        run: npm ci && npm run build

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install protoc + zig
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build console (amd64 musl)
        run: |
          cargo zigbuild --profile release-fast -p dokitier-console --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release-fast/dokitier-console dokitier-console-amd64

      - name: Build core (amd64 musl)
        run: |
          cargo zigbuild --profile release-fast -p dokitier --bin dokitier-core --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release-fast/dokitier-core dokitier-core-amd64

      - name: Build core (arm64 musl)
        run: |
          cargo zigbuild --profile release-fast -p dokitier --bin dokitier-core --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release-fast/dokitier-core dokitier-core-arm64

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dokitier-${{ github.ref_name }}-binaries
          path: |
            dokitier-console-amd64
            dokitier-core-amd64
            dokitier-core-arm64
            scripts/install.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dokitier-console-amd64
            dokitier-core-amd64
            dokitier-core-arm64
            scripts/install.sh
