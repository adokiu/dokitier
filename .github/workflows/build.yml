name: build

# Full-feature binaries for every supported platform/architecture.
# Triggered by a version tag or manually (workflow_dispatch with a tag input).
#
# Release asset naming (standardized):
#   dokitier-core-<version>-<platform>-<arch>[-<flavor>][.exe]
#   dokitier-console-<version>-<platform>-<arch>-min[.exe]
# Examples:
#   dokitier-core-2.7.15-linux-amd64
#   dokitier-core-2.7.15-linux-armv7-min-upx    (size-trimmed, UPX)
#   dokitier-core-2.7.15-linux-armv7-full-upx   (release profile, UPX)
#   dokitier-console-2.7.15-windows-amd64-min.exe
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.7.15)'
        required: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  webui:
    name: build webui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/webui/package-lock.json

      - name: Build webui (embedded into console at compile time)
        working-directory: web/webui
        run: |
          set -e
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html
          du -sh dist

      - name: Upload webui dist
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: web/webui/dist
          if-no-files-found: error

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: webui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: amd64
            ext: ''
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: arm64
            ext: ''
            zig: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            platform: linux
            arch: armv7
            ext: ''
            zig: true
            upx: true
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            platform: linux
            arch: x86
            ext: ''
            zig: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: amd64
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: amd64
            ext: ''
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          set -e
          TAG='${{ inputs.tag || github.ref_name }}'
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download webui dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: web/webui/dist

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev clang libclang-dev upx-ucl

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          brew install upx || true

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc llvm -y --no-progress

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild
        if: ${{ matrix.zig }}
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build core (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CORE_ASSET: dokitier-core-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
        run: |
          set -e
          # Size-constrained armv7/OpenWrt uses the tiny profile; every other
          # target ships the untrimmed release profile (opt-level=3, fat LTO).
          if [ "${{ matrix.upx }}" = "true" ]; then
            PROFILE=tiny
          else
            PROFILE=release
          fi
          echo "core profile: $PROFILE"
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --profile $PROFILE -p dokitier --bin dokitier-core \
              --target ${{ matrix.target }}
          else
            cargo build --profile $PROFILE -p dokitier --bin dokitier-core \
              --target ${{ matrix.target }}
          fi
          cp "target/${{ matrix.target }}/$PROFILE/dokitier-core" "$CORE_ASSET"
          ls -l "$CORE_ASSET"

      - name: Build core (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CORE_ASSET: dokitier-core-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
        run: |
          set -e
          # custom profiles confuse the proto build script on Windows (it looks
          # for a "release"/"debug" path component); use release there.
          cargo build --release -p dokitier --bin dokitier-core \
            --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/dokitier-core.exe" "$CORE_ASSET"
          ls -l "$CORE_ASSET"

      - name: Build console (unix, embedded webui)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CONSOLE_ASSET: dokitier-console-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}-min${{ matrix.ext }}
        run: |
          set -e
          test -f web/webui/dist/index.html
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --profile tiny -p dokitier-console --bin dokitier-console \
              --target ${{ matrix.target }}
          else
            cargo build --profile tiny -p dokitier-console --bin dokitier-console \
              --target ${{ matrix.target }}
          fi
          cp "target/${{ matrix.target }}/tiny/dokitier-console" "$CONSOLE_ASSET"
          ls -l "$CONSOLE_ASSET"

      - name: Build console (windows, embedded webui)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CONSOLE_ASSET: dokitier-console-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}-min${{ matrix.ext }}
        run: |
          set -e
          cargo build --release -p dokitier-console --bin dokitier-console \
            --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/dokitier-console.exe" "$CONSOLE_ASSET"
          ls -l "$CONSOLE_ASSET"

      - name: Build armv7 full variant (release + UPX)
        if: ${{ matrix.upx }}
        shell: bash
        env:
          FULL_ASSET: dokitier-core-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}-full-upx${{ matrix.ext }}
        run: |
          set -e
          cargo zigbuild --profile release -p dokitier --bin dokitier-core \
            --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/dokitier-core" "$FULL_ASSET"
          if upx --best --lzma -o "$FULL_ASSET.upx" "$FULL_ASSET"; then
            mv "$FULL_ASSET.upx" "$FULL_ASSET"
          else
            echo "::warning::upx could not pack the full armv7 build"
            rm -f "$FULL_ASSET.upx"
          fi
          ls -l "$FULL_ASSET"

      - name: Upload armv7 full artifact
        if: ${{ matrix.upx }}
        uses: actions/upload-artifact@v4
        with:
          name: dokitier-core-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}-full-upx${{ matrix.ext }}
          path: dokitier-core-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}-full-upx${{ matrix.ext }}
          if-no-files-found: error

      - name: Compress armv7 with UPX (OpenWrt flash budget)
        if: ${{ matrix.upx }}
        shell: bash
        env:
          CORE_ASSET: dokitier-core-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
        run: |
          set -e
          MIN_ASSET="dokitier-core-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}-min-upx${{ matrix.ext }}"
          cp "$CORE_ASSET" "$CORE_ASSET.raw"
          if upx --best --lzma -o "$CORE_ASSET.upx" "$CORE_ASSET.raw"; then
            mv "$CORE_ASSET.upx" "$MIN_ASSET"
            rm -f "$CORE_ASSET" "$CORE_ASSET.raw"
          else
            echo "::warning::upx could not pack this ELF; shipping the uncompressed binary"
            rm -f "$CORE_ASSET.upx"
            mv "$CORE_ASSET" "$MIN_ASSET"
            rm -f "$CORE_ASSET.raw"
          fi
          ls -l "$MIN_ASSET"

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokitier-core-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.upx && '-min-upx' || '' }}${{ matrix.ext }}
          path: dokitier-core-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.upx && '-min-upx' || '' }}${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload console artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokitier-console-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}-min${{ matrix.ext }}
          path: dokitier-console-${{ steps.ver.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}-min${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: 'dokitier-*'
          merge-multiple: true
          path: release

      - name: List release assets
        run: ls -l release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
            scripts/install.sh
