[package]
name = "dokitier-console"
description = "dokitier standalone board: multi-node reverse-connected console."
version = "2.7.0"
edition.workspace = true
rust-version.workspace = true
license-file = "../LICENSE"

[[bin]]
name = "dokitier-console"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dashmap.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
dokitier-controller = { version = "2.7.0", path = "../controller" }
reqwest = { workspace = true, features = ["rustls", "json"] }
futures = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = ["runtime-tokio", "any", "sqlite", "postgres", "mysql", "tls-rustls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
argon2.workspace = true
rand.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
