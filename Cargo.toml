[workspace]
resolver = "2"
members = [
    "crates/dokitier-core",
    "crates/dokitier-proto",
    "core",
    "web",
    "console",
    "controller",
]
default-members = ["core", "web"]
exclude = []

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
optionize = "0.5"
# Shared versions and sources; members select features and optional dependencies.
anyhow = "1.0"
arc-swap = "1.9"
async-trait = "0.1.92"
atomic-shim = "0.2.0"
auto_impl = "1.3.0"
axum = "0.8"
# Match pbjson 0.9's base64 dependency; upgrade together to avoid two codecs.
base64 = "0.22.1"
bon = "3.10.1"
bytecodec = "0.5.0"
bytes = "1.12.1"
chrono = "0.4.45"
cidr = "0.3.2"
clap = "4.6.7"
crossbeam = "0.8.5"
crossbeam-utils = "0.8.23"
dashmap = "6.2.1"
dokitier = { version = "2.7.11", path = "core", default-features = false }
dokitier-core = { version = "2.7.11", path = "crates/dokitier-core", default-features = false }
dokitier-ffi = { version = "0.1.0", path = "dokitier-contrib/dokitier-ffi", default-features = false }
dokitier-ohos-core = { version = "0.1.0", path = "dokitier-contrib/dokitier-ohrs/crates/dokitier-ohos-core", default-features = false }
dokitier-ohos-features = { version = "0.1.0", path = "dokitier-contrib/dokitier-ohrs/crates/dokitier-ohos-features", default-features = false }
dokitier-proto = { version = "2.7.11", path = "crates/dokitier-proto", default-features = false }
futures = { version = "0.3", default-features = false }
gethostname = "1.1"
guarden = "0.3"
# Keep HMAC/SHA2 on digest 0.10, shared by stun_codec 0.4 and snow 0.10.
# Upgrade this crypto family together when those upstream constraints move.
hmac = "0.12.1"
aes-gcm = "0.10.3"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
indoc = "2.0.7"
log = "0.4"
mimalloc = "*"
once_cell = "1.21"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
pin-project-lite = "0.2.17"
prost = "0.14.4"
prost-types = "0.14.4"
quanta = "0.12"
# rand 0.10 / x25519-dalek 3 require a coordinated RNG trait migration.
rand = "0.8.8"
argon2 = "0.5"
reqwest = { version = "0.13.5", default-features = false }
rust-i18n = "4"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
# tower-sessions-sqlx-store 0.15 requires SQLx 0.8; SeaORM 2 requires SQLx 0.9.
sea-orm = "1.1.20"
sea-orm-migration = "1.1.20"
serde = "1.0.229"
serde_json = "1.0"
# See the HMAC constraint above; SHA2 must use the same digest generation.
sha2 = "0.10.9"
smoltcp = { version = "0.14.0", default-features = false }
sqlx = "0.8.6"
strum = "0.28.0"
stun_codec = "0.4.0"
sys-locale = "0.3"
tauri = "2.11.5"
tempfile = "3.27.0"
thiserror = "2.0"
thunk-rs = { git = "https://github.com/EasyTier/thunk.git", default-features = false }
tokio = { version = "1.53", default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
rcgen = "0.13"
tokio-tungstenite = { version = "0.26", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = "0.7.19"
toml = "1.1.6"
tower-http = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
url = "2.5"
uuid = "1.26.1"
winapi = "0.3.9"
windows = "0.62"
x25519-dalek = "2.0.1"
# zerocopy 0.8 requires migrating the packet layout and casting APIs.
zerocopy = "0.7.35"

[profile.dev]
panic = "unwind"
debug = 2

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = 2
strip = "symbols"

[profile.mini]
inherits = "release"
opt-level = "z"
strip = "symbols"
